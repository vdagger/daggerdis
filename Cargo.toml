[package]
name = "albus"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"
rusty-opus = "1.0"
egui = "0.28"
# renderer wgpu — запасной путь для машин без OpenGL 2.0 (виртуалки, RDP):
# включается переменной ALBUS_RENDERER=wgpu, по умолчанию остаётся glow
eframe = { version = "0.28", features = ["wgpu"] }
iroh = "1"
bytes = "1"
# HWND окна для тёмного заголовка (DWM) — та же версия, что тянет eframe
raw-window-handle = "0.6"

# Захват экрана, аппаратный H.264 (Media Foundation) и DXGI — только Windows.
# Остальные платформы получают заглушки в src/video и собираются без этих фич.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Time",
    "Win32_System_SystemInformation",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
] }

[build-dependencies]
winres = "0.1"

# Локальная замена pollster: нужен только eframe/wgpu, но его .crate нет в
# реестре сборочной машины (реестр принадлежит другому пользователю и read-only).
[patch.crates-io]
pollster = { path = "vendor/pollster" }