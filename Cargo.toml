[package]
name = "albus"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"
rusty-opus = "1.0"
egui = "0.28"
eframe = "0.28"
iroh = "1"
bytes = "1"

# Захват экрана, аппаратный H.264 (Media Foundation) и DXGI — только Windows.
# Остальные платформы получают заглушки в src/video и собираются без этих фич.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[build-dependencies]
winres = "0.1"